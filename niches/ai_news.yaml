# AI News - Daily AI Timeline
# Civilization-scale AI chronicle inspired by The Innermost Loop

name: "AI News"
description: "Daily chronicle of AI and its ripple effects across civilization"
output_dir: "out"

# Branding
branding:
  site_name: "Daily AI Timeline"
  tagline: "Dispatches from the event horizon"

# RSS Feed sources - broad civilization-scale coverage
rss_feeds:
  # AI Labs (primary)
  OpenAI Blog: "https://openai.com/blog/rss.xml"
  Anthropic Blog: "https://www.anthropic.com/rss.xml"
  DeepMind Blog: "https://deepmind.google/blog/rss.xml"

  # Tech News
  The Verge AI: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
  TechCrunch AI: "https://techcrunch.com/category/artificial-intelligence/feed/"
  MIT Tech Review AI: "https://www.technologyreview.com/topic/artificial-intelligence/feed"
  Ars Technica AI: "https://feeds.arstechnica.com/arstechnica/technology-lab"
  Wired AI: "https://www.wired.com/feed/tag/ai/latest/rss"

  # Business & Finance
  Reuters Tech: "https://www.reutersagency.com/feed/?taxonomy=best-topics&post_type=best"
  Bloomberg Tech: "https://feeds.bloomberg.com/technology/news.rss"

  # Energy & Climate
  Ars Technica Science: "https://feeds.arstechnica.com/arstechnica/science"
  Electrek: "https://electrek.co/feed/"

  # Space
  SpaceNews: "https://spacenews.com/feed/"
  NASA Breaking News: "https://www.nasa.gov/news-release/feed/"

  # Biotech & Science
  Nature News: "https://www.nature.com/nature.rss"
  Science Daily AI: "https://www.sciencedaily.com/rss/computers_math/artificial_intelligence.xml"

  # Robotics & Hardware
  IEEE Spectrum: "https://spectrum.ieee.org/feeds/feed.rss"
